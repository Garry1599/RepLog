<style>
:root{--ink:#0b3a57;--mute:#4f7a93;--gl1:rgba(255,255,255,.82);--gl2:rgba(255,255,255,.4);--bd:rgba(255,255,255,.95);--fld:rgba(255,255,255,.85);--sky:linear-gradient(#4fb4f2 0,#a9e2ff 38%,#e6f9ff 68%,#d6f5c4 100%);--hill:#58c63a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e2f4ff;--mute:#8fbad3;--gl1:rgba(20,60,90,.78);--gl2:rgba(10,40,70,.5);--bd:rgba(140,210,255,.5);--fld:rgba(5,30,55,.7);--sky:linear-gradient(#06284a 0,#0b4b7a 45%,#0e6a8a 80%,#145c3a 100%);--hill:#1c7a3a}}
:root[data-theme="dark"]{--ink:#e2f4ff;--mute:#8fbad3;--gl1:rgba(20,60,90,.78);--gl2:rgba(10,40,70,.5);--bd:rgba(140,210,255,.5);--fld:rgba(5,30,55,.7);--sky:linear-gradient(#06284a 0,#0b4b7a 45%,#0e6a8a 80%,#145c3a 100%);--hill:#1c7a3a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font:400 16px/1.4 "Segoe UI","Frutiger","Open Sans",system-ui,sans-serif}
body{background:var(--sky) fixed;position:relative}
body::before{content:"";position:fixed;left:-20%;right:-20%;bottom:-18vh;height:36vh;border-radius:50%;background:radial-gradient(ellipse at 50% 0,#9bec6a,var(--hill) 60%);opacity:.85;pointer-events:none}
.bub{position:fixed;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.15) 45%,rgba(120,210,255,.25));border:1px solid rgba(255,255,255,.8)}
main{position:relative;max-width:560px;margin:0 auto;padding:14px 14px 110px}
h1{margin:0;font-size:30px;font-weight:700;color:#fff;text-shadow:0 1px 0 #0b86c9,0 2px 6px rgba(0,70,130,.6)}
h2{margin:0 0 8px;font-size:19px;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gl{background:linear-gradient(180deg,var(--gl1),var(--gl2));border:1px solid var(--bd);border-radius:18px;box-shadow:0 6px 18px rgba(0,80,150,.25),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card{padding:14px;margin-bottom:12px}
.timer{display:none;font:700 20px "Segoe UI",sans-serif;color:#fff;border:1px solid #2b8a14;border-radius:999px;padding:3px 14px;background:linear-gradient(#b6f27a,#4cc22b 50%,#2fa514 51%,#6fd84a);text-shadow:0 -1px 0 rgba(0,70,0,.5);box-shadow:inset 0 1px 1px #fff,0 2px 5px rgba(0,80,0,.4)}
.timer.on{display:block}
.btn{position:relative;font:600 16px "Segoe UI","Open Sans",sans-serif;color:#fff;text-shadow:0 -1px 0 rgba(0,60,100,.55);border:1px solid #0a79b5;border-radius:999px;padding:10px 16px;white-space:nowrap;background:linear-gradient(#8de6ff,#1ea3e0 50%,#0b86c9 51%,#3fbaf2);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 2px 6px rgba(0,80,140,.4)}
.btn:active{filter:brightness(.92)}
.go{border-color:#2b8a14;background:linear-gradient(#c3f78b,#4cc22b 50%,#2fa514 51%,#6fd84a);text-shadow:0 -1px 0 rgba(0,70,0,.5)}
.ghost{color:var(--ink);text-shadow:none;border-color:var(--bd);background:linear-gradient(var(--gl1),var(--gl2))}
.big{width:100%;padding:14px;font-size:18px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px}
input,select,textarea{font:600 17px "Segoe UI","Open Sans",sans-serif;color:var(--ink);background:var(--fld);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;width:100%;min-width:0;box-shadow:inset 0 2px 4px rgba(0,80,140,.18)}
button:focus-visible,input:focus,select:focus{outline:2px solid #1ea3e0;outline-offset:1px}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.set{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(80,160,210,.3)}
.set .n{width:26px;color:var(--mute);font-weight:700}
.set .v{flex:1;font-size:18px}
.pr{font-size:12px;font-weight:700;color:#fff;background:linear-gradient(#ffd35a,#f0a000);border-radius:999px;padding:1px 8px;margin-left:6px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid rgba(80,160,210,.3)}
.mute{color:var(--mute)}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;display:flex;padding:6px;gap:4px;border-radius:26px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 12px "Segoe UI",sans-serif;padding:6px 0;border-radius:20px}
.tabs button span{display:block;font-size:20px}
.tabs button.on{color:#fff;text-shadow:0 -1px 0 rgba(0,60,100,.5);background:linear-gradient(#8de6ff,#1ea3e0 50%,#0b86c9 51%,#3fbaf2);box-shadow:inset 0 1px 1px #fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tiles .gl{padding:12px;text-align:center}.tiles b{display:block;font-size:26px}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px}
.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars i{width:100%;border-radius:8px 8px 2px 2px;background:linear-gradient(#b6f27a,#2fa514);border:1px solid #2b8a14;min-height:2px}
.bars small{font-size:11px;color:var(--mute);margin-top:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:7px;background:rgba(255,255,255,.45);border:1px solid var(--bd)}
.heat i.l1{background:#a9ec7e}.heat i.l2{background:#5fd13c}.heat i.l3{background:#2fa514}
.meter{height:12px;border-radius:99px;background:rgba(255,255,255,.5);border:1px solid var(--bd);overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:linear-gradient(#8de6ff,#1ea3e0)}
.seg{display:flex;gap:8px}.seg .btn{flex:1}
.wbar{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:12px;border-radius:999px}
.lr{display:grid;grid-template-columns:38px 64px 54px 1fr 28px;gap:8px;align-items:center;padding:8px 0}
.circ{width:36px;height:36px;border-radius:50%;border:2px solid #1ea3e0;background:linear-gradient(#fff,rgba(255,255,255,.4));font:700 15px "Segoe UI",sans-serif;color:#fff;box-shadow:inset 0 2px 3px rgba(0,80,140,.25);padding:0}
.circ.on{border-color:#2b8a14;background:linear-gradient(#c3f78b,#4cc22b 50%,#2fa514 51%,#6fd84a);text-shadow:0 -1px 0 rgba(0,70,0,.5);box-shadow:inset 0 1px 1px #fff,0 2px 4px rgba(0,80,0,.35)}
.f{display:block;min-width:0}.f small{display:block;font-size:12px;color:var(--mute)}
.cell{background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;box-shadow:none;padding:2px 0;font:700 22px "Segoe UI",sans-serif}
.nt .cell{font:500 15px "Segoe UI",sans-serif;padding:6px 0}
.smenu{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 8px}.smenu .btn{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5}.chips.wrap{flex-wrap:wrap;overflow:visible}
.rt{display:flex;align-items:center;gap:10px}.rtm{flex:1;min-width:0}
.cfo{position:fixed;inset:0;z-index:20;background:rgba(0,40,70,.5);display:flex;align-items:center;justify-content:center;padding:20px}.cfb{width:100%;max-width:380px;margin:0;background:linear-gradient(#f4fcff,#d4efff)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cfb{background:linear-gradient(#124a73,#0b3552)}}
.dng{border-color:#a51d0c!important;background:linear-gradient(#ff9a8a,#e0341f 50%,#c4210e 51%,#f06a52)!important}
.pv{display:block;font-size:12px;color:var(--mute);min-height:14px}.xn{font:500 14px "Segoe UI",sans-serif;padding:6px 10px;margin-top:8px}
.stype{grid-column:2/-1;justify-self:start;display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;background:var(--fld)}
.stype button{border:0;background:none;color:var(--mute);font:600 13px "Segoe UI",sans-serif;padding:5px 14px}
.stype button.on{color:#fff;background:linear-gradient(#8de6ff,#1ea3e0 50%,#0b86c9 51%,#3fbaf2);text-shadow:0 -1px 0 rgba(0,60,100,.5)}
.stype button.on.wu{background:linear-gradient(#ffe38a,#f5ae1a 50%,#e08a00 51%,#ffc84a);text-shadow:0 -1px 0 rgba(120,60,0,.5)}
.play{width:54px;height:54px;border-radius:50%;flex:none;font-size:22px;color:#fff;padding:0 0 0 4px;border:1px solid #2b8a14;background:linear-gradient(#c3f78b,#4cc22b 50%,#2fa514 51%,#6fd84a);text-shadow:0 -1px 0 rgba(0,70,0,.5);box-shadow:inset 0 1px 1px #fff,0 3px 8px rgba(0,80,0,.4)}.play:disabled{opacity:.45}.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.chips .btn{padding:6px 14px;font-size:14px;flex:none}
</style></head>
<body>
<i class="bub" style="width:90px;height:90px;left:6%;top:14%"></i><i class="bub" style="width:46px;height:46px;right:9%;top:30%"></i><i class="bub" style="width:130px;height:130px;right:-30px;top:62%"></i><i class="bub" style="width:30px;height:30px;left:14%;top:70%"></i>
<main>
<header><h1>RepLog</h1><button class="timer" id="timer" data-act="stoptimer" aria-label="Zastavit odpočinek"></button></header>
<div id="view"></div>
</main>
<nav class="tabs gl" id="nav"></nav>
<script>
const KEY="replog-v2";
let S={cur:null,hist:[],tpl:[],bw:[],mg:{},unit:"kg",rest:90};
try{const r=localStorage.getItem(KEY)||localStorage.getItem("replog-v1");if(r)Object.assign(S,JSON.parse(r))}catch(e){}
let tab="w",rest=0,tick=null,sel="",ed=null,he=null,re=null,hf="";
const normTpl=()=>{S.xn=S.xn||{};S.tpl.forEach(t=>t.ex=t.ex.map(x=>typeof x==="string"?{n:x,s:3}:x))};normTpl();
const pad=n=>String(n).padStart(2,"0");
const gw=r=>(r===undefined||r==="c")?S.cur:S.hist[+r];
const isoD=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const liveDur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+":"+pad(m)+":"+pad(s%60):m+":"+pad(s%60)};
const fmtDur=ms=>{const m=Math.round(ms/6e4),h=Math.floor(m/60);return h?h+" h "+pad(m%60)+" min":m+" min"};
setInterval(()=>{const d=$("dur");if(d&&S.cur)d.textContent=liveDur(Date.now()-S.cur.date)},1000);
function sugg(name){const p=S.hist.find(w=>w.ex.some(e=>same(e.name,name)&&work(e).length));if(!p)return null;const ws=work(p.ex.find(e=>same(e.name,name))),mx=Math.max(...ws.map(s=>s.w)),top=ws.filter(s=>s.w===mx);if(!top.every(s=>s.r>=8))return null;return{from:mx,to:Math.round((mx+(S.unit==="kg"?2.5:5))*100)/100,reps:top.map(s=>s.r).join(", ")}}
let sm=null,em=null,fr=0,pick=0,fc=0,ap=0,cf=null;
const mk=n=>{const l=lastSet(n);return{w:l?l.w:0,r:l?l.r:8,p:1}};
function syncRow(row){if(!row||!S.cur)return;const s=S.cur.ex[+row.dataset.i].sets[+row.dataset.j];if(!s)return;row.querySelectorAll("[data-f]").forEach(t=>{if(t.dataset.f==="n")s.n=t.value;else{const v=parseFloat(t.value.replace(",","."));if(v>=0)s[t.dataset.f]=v}})}
function prevSet(name,e,j){const p=S.hist.find(w=>w.ex.some(x=>same(x.name,name)&&x.sets.length));if(!p)return null;const pe=p.ex.find(x=>same(x.name,name)&&x.sets.length),u=!!e.sets[j].u,k=e.sets.slice(0,j).filter(x=>!!x.u===u).length,l=pe.sets.filter(x=>!!x.u===u);return l[k]||null}
function liveRow(e,s,j,i){
  const n=s.u?"Z":j+1-e.sets.slice(0,j).filter(x=>x.u).length,d=`data-i="${i}" data-j="${j}"`,pq=prevSet(e.name,e,j);
  return`<div class="set lr" data-cur="1" ${d}><button class="circ ${s.p?"":"on"}" data-act="done" ${d} aria-label="${s.p?"Označit jako hotovou":"Vrátit na nezapsanou"}">${s.p?"":n}</button><label class="f"><small>Váha</small><input class="cell" data-f="w" type="text" inputmode="decimal" value="${s.w}"><span class="pv">${pq?pq.w:""}</span></label><label class="f"><small>Opak.</small><input class="cell" data-f="r" type="text" inputmode="numeric" value="${s.r}"><span class="pv">${pq?pq.r:""}</span></label><label class="f nt"><small>Poznámka ${s.pr?`<span class="pr">PR</span>`:""}</small><input class="cell" data-f="n" type="text" value="${esc(s.n||"")}"></label><button class="x" data-act="smenu" ${d} aria-label="Možnosti série">⋯</button><div class="stype"><button class="${s.u?"":"on"}" data-act="stype" data-k="w" ${d}>Pracovní</button><button class="${s.u?"on wu":""}" data-act="stype" data-k="u" ${d}>Zahřívací</button></div></div>${sm&&sm.i===i&&sm.j===j?`<div class="smenu"><button class="btn ghost" data-act="swarm" ${d}>${s.u?"Pracovní série":"Zahřívací série"}</button><button class="btn ghost" data-act="sdup" ${d}>Duplikovat</button><button class="btn ghost" data-act="delset" data-ref="c" ${d}>Smazat</button></div>`:""}`}
function vWork(){
  if(!S.cur)return vHome();
  const w=S.cur,u=S.unit,pend=w.ex.reduce((a,e)=>a+e.sets.filter(s=>s.p).length,0);
  const bar=`<div class="gl wbar"><button class="btn go" data-act="finish">Dokončit</button><div style="flex:1;line-height:1.2;min-width:0"><b>${fmtD(w.date)}</b><br><small class="mute">⏱ <span id="dur">${liveDur(Date.now()-w.date)}</span> · ${Math.round(vol(w.ex))} ${u}${pend?` · ${pend} nezapsaných`:""}</small></div><button class="btn ghost" data-act="rest" aria-label="Odpočinek">⏰ ${S.rest} s</button></div>`;
  const cards=w.ex.map((e,i)=>{
    const pb=best(e.name),sg=!e.sets.some(s=>!s.p)&&(e.sg===undefined||e.sg==="n1")?sugg(e.name):null;
    return`<div class="gl card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${esc(e.name)} <small class="mute">${esc(S.mg[e.name]||"")}</small></h2><button class="x" data-act="emenu" data-i="${i}" aria-label="Možnosti cviku">⋯</button></div>${em===i?`<div class="smenu"><button class="btn ghost" data-act="delex" data-i="${i}">Smazat cvik</button></div>`:""}<input class="xn" data-xn="${i}" placeholder="Poznámka ke cviku (sedadlo, úchop…)" value="${esc(S.xn[e.name]||"")}" aria-label="Poznámka ke cviku">${pb?`<div class="mute" style="font-size:13px">Nejlepší odhad 1RM: ${Math.round(pb)} ${u}</div>`:""}${sg?sugBlock(e,i,sg,u):""}<div class="sets">${e.sets.map((s,j)=>liveRow(e,s,j,i)).join("")}</div><div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="addrow" data-i="${i}">＋ Přidat sérii</button><button class="x" data-act="exstat" data-i="${i}" aria-label="Statistiky cviku" style="font-size:22px">📊</button></div></div>`}).join("");
  return bar+(fc&&pend?`<div class="gl card"><b>Nezapsané série: ${pend}</b><p class="mute" style="margin:4px 0 0">${w.ex.some(e=>e.sets.some(s=>!s.p))?"Pokud je zahodíš, neuloží se.":"Zatím není zapsaná žádná série, trénink by se vůbec neuložil."}</p><div class="row"><button class="btn go" style="flex:1" data-act="fin" data-k="all">Zapsat jako hotové</button></div><div class="row"><button class="btn ghost" style="flex:1" data-act="fin" data-k="drop">Zahodit</button><button class="btn ghost" style="flex:1" data-act="fincancel">Zpět</button></div></div>`:"")+cards+addCard()+rtCard()+`<div class="gl card"><input id="note" placeholder="Poznámka k tréninku" value="${esc(w.note||"")}" aria-label="Poznámka"></div>`;
}
function vStart(){
  const cw=wk(Date.now()),wc=S.hist.filter(w=>w.date>=cw).length,last=S.hist[0];
  return`<div class="gl card" style="text-align:center;padding:26px 14px"><h2 style="font-size:26px;margin:0 0 6px">Připraven?</h2><p class="mute" style="margin:0 0 18px">${wc?`Tento týden už ${wc} ${wc===1?"trénink":wc<5?"tréninky":"tréninků"}.`:"Tento týden zatím žádný trénink."}${last?` Naposledy: ${fmtD(last.date)}${last.rt?` (${esc(last.rt)})`:""}.`:""}</p><button class="btn go big" data-act="pickon" style="font-size:22px;padding:18px">Začít trénink</button></div>`}
function vHome(){if(!pick)return vStart();
  const cw=wk(Date.now()),wc=S.hist.filter(w=>w.date>=cw).length,pl=(n,a,b,c)=>n===1?a:n<5?b:c;
  const hero=`<div class="gl card" style="text-align:center"><h2 style="font-size:24px;margin:0">Vyber rutinu</h2><p class="mute" style="margin:4px 0 0">${S.tpl.length?(wc?`Tento týden už ${wc} ${pl(wc,"trénink","tréninky","tréninků")}.`:"Tento týden zatím žádný trénink."):"Vytvoř si první rutinu a pak ji spouštíš jedním klepnutím."}</p></div>`;
  const cards=S.tpl.map((t,i)=>{
    const last=S.hist.find(w=>w.rt===t.name),sets=t.ex.reduce((a,x)=>a+x.s,0),n=t.ex.length;
    return`<div class="gl card rt"><div class="rtm"><h2 style="margin:0">${esc(t.name)}</h2><div class="mute" style="font-size:14px">${n?`${n} ${pl(n,"cvik","cviky","cviků")} · ${sets} sérií`:"Zatím bez cviků"}${last?` · ${fmtD(last.date)}`:""}</div><div class="mute" style="font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.ex.map(x=>esc(x.n)).join(", ")}</div></div><button class="x" data-act="rgo" data-i="${i}" aria-label="Upravit rutinu">✎</button>${n?`<button class="play" data-act="rstart" data-i="${i}" aria-label="Začít rutinu ${esc(t.name)}">▶</button>`:""}</div>`}).join("");
  return`<button class="btn ghost" data-act="pickoff" style="margin-bottom:12px">‹ Zpět</button>`+hero+cards+`<button class="btn go big" data-act="rnewgo">＋ Nová rutina</button>`;
}
const CAT={"Hrudník":["Bench press","Šikmý bench press","Rozpažky s jednoručkami","Kliky","Tlaky na stroji"],"Záda":["Mrtvý tah","Přítahy v předklonu","Shyby","Stahování kladky nadhmatem","Přítahy na kladce vsedě"],"Nohy":["Dřepy","Rumunský mrtvý tah","Leg press","Předkopávání","Zakopávání","Výpady","Výpony na lýtka"],"Ramena":["Tlak na ramena","Upažování","Předpažování","Face pully","Arnold press"],"Paže":["Bicepsový zdvih s činkou","Kladivové zdvihy","Tricepsové stahování na kladce","Francouzský tlak","Dipy"],"Střed těla":["Plank","Zkracovačky","Zdvihy nohou ve visu","Russian twist","Rotace na kladce"]};
let rg="Hrudník";
function rEdit(t,i){

  const mt=Object.values(mg).reduce((a,b)=>a+b,0)||1;
  const ex=names().filter(n=>H.some(w=>w.ex.some(e=>same(e.name,n))));if(!sel||!ex.includes(sel))sel=ex[0]||"";
  const pts=H.filter(w=>w.ex.some(e=>same(e.name,sel)&&work(e).length)).reverse().map(w=>({x:w.date,y:Math.max(...work(w.ex.find(e=>same(e.name,sel))).map(e1))}));
  const prs=ex.map(n=>{let bw=0,b1=0;H.forEach(w=>w.ex.forEach(e=>{if(same(e.name,n))work(e).forEach(s=>{bw=Math.max(bw,s.w);b1=Math.max(b1,e1(s))})}));return{n,bw,b1}});
  return`<div class="tiles"><div class="gl"><b>${H.length}</b>tréninků</div><div class="gl"><b>${sets}</b>pracovních sérií</div><div class="gl"><b>${Math.round(H.reduce((a,w)=>a+vol(w.ex),0)/1000*10)/10} t</b>celkový objem</div><div class="gl"><b>${st}</b>týdnů v řadě</div><div class="gl"><b>${dd.length?Math.round(td/dd.length/6e4):"–"} min</b>průměrná délka</div><div class="gl"><b>${Math.round(td/36e5*10)/10} h</b>celkem v posilovně</div></div>
  <div class="gl card"><h2>Objem po týdnech (${S.unit})</h2>${bars(wv,wl)}</div>
  <div class="gl card"><h2>Posledních 5 týdnů</h2><div class="heat">${heat}</div></div>
  <div class="gl card"><h2>Svalové partie (30 dní, série)</h2>${Object.entries(mg).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-top:6px"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${v}</b></div><div class="meter"><i style="width:${Math.round(v/mt*100)}%"></i></div></div>`).join("")||`<p class="mute">Žádná data.</p>`}</div>
  <div class="gl card"><h2>Pokrok ve cviku (odhad 1RM)</h2><select id="chex" aria-label="Cvik">${ex.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("")}</select><div style="margin-top:10px">${line(pts,S.unit)}</div></div>
  <div class="gl card"><h2>Osobní rekordy</h2>${prs.map(p=>`<div class="stat"><span>${esc(p.n)}</span><span><b>${p.bw} ${S.unit}</b> <span class="mute">· 1RM ~${Math.round(p.b1)}</span></span></div>`).join("")}</div>`;
}
function vMore(){
  const u=S.unit;
  return`<div class="gl card"><h2>Nastavení</h2><div class="row" style="margin-top:0"><span style="flex:1">Doba odpočinku</span><button class="btn ghost" data-act="rm" aria-label="Méně">−</button><b style="min-width:52px;text-align:center">${S.rest} s</b><button class="btn ghost" data-act="rp" aria-label="Více">+</button></div>
  <div class="seg row"><button class="btn ${u==="kg"?"":"ghost"}" data-act="unit" data-k="kg">kg</button><button class="btn ${u==="lb"?"":"ghost"}" data-act="unit" data-k="lb">lb</button></div><p class="mute" style="font-size:13px;margin:6px 0 0">Přepnutí mění jen popisek, uložené hodnoty se nepřepočítávají.</p></div>
  <div class="gl card"><h2>Rutiny</h2>${S.tpl.map((t,i)=>`<div class="stat"><span>${esc(t.name)} <span class="mute">(${t.ex.map(x=>esc(x.n)).join(", ")})</span></span><button class="x" data-act="tpldel" data-i="${i}" aria-label="Smazat šablonu">✕</button></div>`).join("")||`<p class="mute" style="margin:0">Zatím žádné.</p>`}
  ${S.cur&&S.cur.ex.length?`<div class="row"><input id="tplname" placeholder="Název šablony" aria-label="Název šablony"><button class="btn go" data-act="tplsave">Uložit</button></div>`:`<p class="mute" style="font-size:13px;margin:8px 0 0">Spusť trénink s cviky a ulož ho jako rutinu.</p>`}</div>
  <div class="gl card"><h2>Tělesná váha</h2><div class="row" style="margin-top:0"><input id="bwv" type="number" inputmode="decimal" placeholder="${u}" aria-label="Tělesná váha"><button class="btn go" data-act="bwadd">Zapsat</button></div>
  <div style="margin-top:8px">${line(S.bw.map(b=>({x:b.d,y:b.w})),u)}</div>${S.bw.slice(-3).reverse().map((b,k)=>`<div class="stat"><span>${fmtD(b.d)}</span><span><b>${b.w} ${u}</b> <button class="x" data-act="bwdel" data-i="${S.bw.length-1-k}" aria-label="Smazat záznam">✕</button></span></div>`).join("")}</div>
  <div class="gl card"><h2>Kalkulačka kotoučů</h2><input id="pct" data-calc="1" type="number" inputmode="decimal" placeholder="Cílová váha (${u})" aria-label="Cílová váha"><p id="pco" style="margin:8px 0 0"></p></div>
  <div class="gl card"><h2>Kalkulačka 1RM</h2><div class="row" style="margin-top:0"><input id="ow" data-calc="1" type="number" inputmode="decimal" placeholder="${u}" aria-label="Váha"><input id="or" data-calc="1" type="number" inputmode="numeric" placeholder="opak." aria-label="Opakování"></div><div id="oo"></div></div>
  <div class="gl card"><h2>Záloha dat</h2><p class="mute" style="font-size:13px;margin:0 0 6px">Zkopíruj celý text a ulož ho někam bokem (poznámky, e-mail sobě). Obnovení přepíše současná data.</p><textarea id="bk" rows="3" readonly aria-label="Záloha">${esc(JSON.stringify(S))}</textarea><div class="row"><button class="btn" style="flex:1" data-act="bkcopy">Označit a kopírovat</button></div><textarea id="imp" rows="3" placeholder="Sem vlož zálohu" style="margin-top:10px" aria-label="Vložit zálohu"></textarea><div class="row"><button class="btn go" style="flex:1" data-act="impdata">Obnovit ze zálohy</button></div><p id="impmsg" class="mute" style="margin:6px 0 0;font-size:13px"></p></div>
  <div class="gl card"><h2>Export (CSV)</h2><textarea id="csv" rows="4" readonly aria-label="CSV export">${esc(csv())}</textarea><p class="mute" style="font-size:13px;margin:6px 0 0">Označ text a zkopíruj ho do tabulky.</p></div>`;
}
function csv(){const r=["datum,cvik,serie,vaha,opakovani,zahrivaci"];S.hist.forEach(w=>w.ex.forEach(e=>e.sets.forEach((s,j)=>r.push([new Date(w.date).toISOString().slice(0,10),'"'+e.name.replace(/"/g,'""')+'"',j+1,s.w,s.r,s.u?1:0].join(",")))));return r.join("\n")}
function calc(){
  const p=$("pct");if(p){const t=parseFloat(p.value),bar=S.unit==="kg"?20:45,pl=S.unit==="kg"?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5];let o="";
    if(t>bar){let r=(t-bar)/2;const u=[];pl.forEach(x=>{while(r>=x-1e-9){u.push(x);r-=x}});o=`Tyč ${bar} ${S.unit}, na každou stranu: <b>${u.join(" + ")||"nic"}</b>${r>0.01?`<br><span class="mute">Zbývá ${Math.round(r*200)/100} ${S.unit} na stranu.</span>`:""}`}else if(p.value)o=`Cíl musí být těžší než tyč (${bar} ${S.unit}).`;$("pco").innerHTML=o}
  const w=parseFloat(($("ow")||{}).value),r=parseInt(($("or")||{}).value,10);
  if($("oo"))$("oo").innerHTML=w>0&&r>0?(()=>{const m=e1({w,r});return`<p style="margin:8px 0 4px">Odhad 1RM: <b>${Math.round(m*10)/10} ${S.unit}</b></p>`+[95,90,85,80,75,70,65,60].map(x=>`<div class="stat"><span>${x} %</span><b>${Math.round(m*x/100*2)/2} ${S.unit}</b></div>`).join("")})():""}
document.addEventListener("input",e=>{if(e.target.dataset.calc)calc()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="rex"||e.target.id==="newex")){const bt=document.querySelector('[data-act="radd"],[data-act="addex"]');if(bt)bt.click()}});
document.addEventListener("change",e=>{
  if(e.target.id==="rname"&&S.tpl[re]){const o=S.tpl[re].name,nn=e.target.value.trim();S.hist.forEach(w=>{if(o&&nn&&w.rt===o)w.rt=nn});S.tpl[re].name=nn;save();return}
  if(e.target.dataset.xn!==undefined&&S.cur){const ex=S.cur.ex[+e.target.dataset.xn];if(ex){const v=e.target.value.trim();if(v)S.xn[ex.name]=v;else delete S.xn[ex.name]}save();return}
  if(e.target.dataset.f&&S.cur){syncRow(e.target.closest(".set"));save();return}
  if(e.target.id==="chex"){sel=e.target.value;render()}
  if(e.target.id==="hd"&&e.target.value&&S.hist[he]){const w=S.hist[he];w.date=new Date(e.target.value+"T12:00:00").getTime();S.hist.sort((a,b)=>b.date-a.date);he=S.hist.indexOf(w);save();render()}
  if(e.target.id==="hdur"&&S.hist[he]){const m=parseFloat(e.target.value);if(m>=0){S.hist[he].dur=Math.round(m*6e4);save();render()}}
  if(e.target.id==="note"&&S.cur){S.cur.note=e.target.value;save()}
});
const DEL={delset:"Smazat tuto sérii?",delex:"Smazat tento cvik?",delw:"Smazat celý trénink z historie?",tpldel:"Smazat rutinu?",rdel:"Smazat rutinu?",bwdel:"Smazat záznam váhy?",rrm:"Odebrat cvik z rutiny?"};
document.addEventListener("click",ev=>{const b0=ev.target.closest("[data-act]");if(b0)onAct(b0)});
function onAct(b,ok){
  const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j;
  const rw=b.closest(".set");if(rw&&rw.dataset.cur)syncRow(rw);if(a!=="finish"&&a!=="fin")fc=0;
  if(DEL[a]&&!ok){cf={snap:{dataset:{...b.dataset},closest:()=>null},msg:DEL[a]};render();return}
  if(a==="tab"){tab=b.dataset.k;ed=null;sm=null;em=null;pick=0}
  else if(a==="start")S.cur={date:Date.now(),ex:[]};
  else if(a==="rnewgo"){S.tpl.push({name:"",ex:[]});re=S.tpl.length-1;tab="r";fr=1;pick=0}
  else if(a==="tplstart"||a==="rstart"){startRt(i);tab="w";pick=0}
  else if(a==="pickon")pick=1;
  else if(a==="pickoff")pick=0;
  else if(a==="addex"){const v=$("newex").value.trim();if(!v)return;if(!S.mg[v])S.mg[v]=rg;if(!S.cur.ex.some(e=>same(e.name,v)))S.cur.ex.push({name:v,sets:[mk(v)]})}
  else if(a==="addset"){const w=parseFloat($("w"+i).value.replace(",",".")),r=parseInt($("r"+i).value,10);if(!(w>=0)||!(r>0))return;const e=S.cur.ex[i],s={w,r};
    if($("u"+i).checked)s.u=1;else{const pb=best(e.name);if(pb>0&&e1(s)>pb)s.pr=1}
    e.sets.push(s);startTimer(S.rest)}
  else if(a==="delset"){gw(b.dataset.ref).ex[i].sets.splice(j,1);ed=null;sm=null}
  else if(a==="delex"){gw(b.dataset.ref).ex.splice(i,1);ed=null;sm=null;em=null}
  else if(a==="rest"){startTimer(S.rest);return}
  else if(a==="stoptimer"){clearInterval(tick);rest=0;paint();return}
  else if(a==="fincancel")fc=0;
  else if(a==="finish"||a==="fin"){const pn=S.cur.ex.reduce((x,e)=>x+e.sets.filter(s=>s.p).length,0);if(a==="finish"&&pn){fc=1;render();return}fc=0;ap=0;if(b.dataset.k==="all")S.cur.ex.forEach(e=>e.sets.forEach(s=>{if(s.p){delete s.p;if(!s.u){const pb=best(e.name);if(pb>0&&e1(s)>pb)s.pr=1}}}));S.cur.dur=Date.now()-S.cur.date;S.cur.ex.forEach(e=>e.sets=e.sets.filter(s=>!s.p));S.cur.ex=S.cur.ex.filter(e=>e.sets.length);sm=null;em=null;if(S.cur.ex.length)S.hist.unshift(S.cur);S.cur=null;tab="h"}
  else if(a==="delw"){S.hist.splice(i,1);he=null;ed=null}
  else if(a==="rm")S.rest=Math.max(15,S.rest-15);
  else if(a==="rp")S.rest=Math.min(600,S.rest+15);
  else if(a==="unit")S.unit=b.dataset.k;
  else if(a==="tplsave"){const n=$("tplname").value.trim();if(!n)return;S.tpl.push({name:n,ex:S.cur.ex.map(e=>({n:e.name,s:Math.max(1,e.sets.length)}))})}
  else if(a==="tpldel")S.tpl.splice(i,1);
  else if(a==="bwadd"){const v=parseFloat($("bwv").value.replace(",","."));if(!(v>0))return;S.bw.push({d:Date.now(),w:v})}
  else if(a==="bwdel")S.bw.splice(i,1);
  else if(a==="eedit")ed={ref:b.dataset.ref,i,j};
  else if(a==="ecancel")ed=null;
  else if(a==="esave"){const w=parseFloat($("ew").value.replace(",",".")),r=parseInt($("er").value,10);if(!(w>=0)||!(r>0))return;const s=gw(ed.ref).ex[ed.i].sets[ed.j];s.w=w;s.r=r;if($("eu").checked){s.u=1;delete s.pr}else delete s.u;ed=null}
  else if(a==="hedit"){he=he===i?null:i;ed=null}
  else if(a==="done"){const e=S.cur.ex[i],s=e.sets[j];if(s.p){delete s.p;if(!s.u){const pb=best(e.name);if(pb>0&&e1(s)>pb)s.pr=1}startTimer(S.rest)}else{s.p=1;delete s.pr}sm=null}
  else if(a==="addrow"){const e=S.cur.ex[i],l=e.sets.length?e.sets[e.sets.length-1]:lastSet(e.name);e.sets.push({w:l?l.w:0,r:l?l.r:8,p:1})}
  else if(a==="smenu")sm=(sm&&sm.i===i&&sm.j===j)?null:{i,j};
  else if(a==="swarm"){const s=S.cur.ex[i].sets[j];if(s.u)delete s.u;else{s.u=1;delete s.pr}sm=null}
  else if(a==="sdup"){const e=S.cur.ex[i],s=e.sets[j];e.sets.splice(j+1,0,{w:s.w,r:s.r,p:1});sm=null}
  else if(a==="emenu")em=em===i?null:i;
  else if(a==="exstat"){sel=S.cur.ex[i].name;tab="s"}
  else if(a==="hf")hf=b.dataset.k||"";
  else if(a==="rnew"){S.tpl.push({name:"",ex:[]});re=S.tpl.length-1;fr=1}
  else if(a==="rgo"){re=i;tab="r"}
  else if(a==="rquick"){S.tpl[i].ex.push({n:b.dataset.n,s:3})}
  else if(a==="redit")re=re===i?null:i;
  else if(a==="rdel"){S.tpl.splice(i,1);re=null}
  else if(a==="radd"){const v=$("rex").value.trim();if(!v)return;if(!S.mg[v])S.mg[v]=rg;if(!S.tpl[i].ex.some(x=>same(x.n,v)))S.tpl[i].ex.push({n:v,s:3})}
  else if(a==="rg")rg=b.dataset.k;
  else if(a==="cfno")cf=null;
  else if(a==="cfyes"){if(!cf)return;const s=cf.snap;cf=null;onAct(s,1);return}
  else if(a==="apon")ap=1;
  else if(a==="apoff")ap=0;
  else if(a==="acat"){const n=b.dataset.n;if(!S.cur.ex.some(e=>same(e.name,n))){if(!S.mg[n])S.mg[n]=rg;S.cur.ex.push({name:n,sets:[mk(n)]})}}
  else if(a==="rsave"){const d=rtDiff();if(d)d.t.ex=d.cur.map(c=>({n:c.n,s:c.s}))}
  else if(a==="hrep"){const w=S.hist[i];if(S.cur)return;S.cur={date:Date.now(),rt:w.rt,nosync:1,ex:w.ex.map(e=>({name:e.name,sets:e.sets.map(s=>{const o={w:s.w,r:s.r,p:1};if(s.u)o.u=1;return o})}))};tab="w";pick=0}
  else if(a==="stype"){const s=S.cur.ex[i].sets[j];if(b.dataset.k==="u"){s.u=1;delete s.pr}else delete s.u}
  else if(a==="rcat"){const n=b.dataset.n;if(!S.tpl[i].ex.some(x=>same(x.n,n)))S.tpl[i].ex.push({n,s:3});if(!S.mg[n])S.mg[n]=rg}
  else if(a==="rrm")S.tpl[i].ex.splice(j,1);
  else if(a==="rsm"||a==="rsp"){const x=S.tpl[i].ex[j];x.s=Math.max(1,Math.min(10,x.s+(a==="rsp"?1:-1)))}
  else if(a==="rup"||a==="rdn"){const l=S.tpl[i].ex,k=j+(a==="rup"?-1:1);if(k<0||k>=l.length)return;[l[j],l[k]]=[l[k],l[j]]}
  else if(a==="sugyes"){const e=S.cur.ex[i];e.sg="y";e.tw=sugg(e.name).to;e.sets.forEach(s=>{if(s.p)s.w=e.tw})}
  else if(a==="sugno"){const e=S.cur.ex[i];e.sg=e.sg==="n1"?"n2":"n1"}
  else if(a==="bkcopy"){const t=$("bk");t.focus();t.select();try{document.execCommand("copy")}catch(x){}return}
  else if(a==="impdata"){try{const d=JSON.parse($("imp").value);if(!d||!Array.isArray(d.hist))throw 0;S=Object.assign({cur:null,hist:[],tpl:[],bw:[],mg:{},unit:"kg",rest:90},d);tab="h";ed=null;he=null;normTpl()}catch(x){$("impmsg").textContent="Neplatná záloha – vlož celý zkopírovaný text.";return}}
  if(S.cur&&S.cur.rt){const d=rtDiff();if(d)d.t.ex=d.cur.map(c=>({n:c.n,s:c.s}))}save();render();
}
render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
